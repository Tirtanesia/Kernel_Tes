name: Build Lotus

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c2s, c2slte, c1s, c1slte, z3s, y2s, y2slte, x1s, x1slte, r8s]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          set -eux

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc curl ca-certificates git zip unzip xz-utils p7zip-full \
            bison flex libelf-dev libssl-dev python3 python3-distutils pkg-config \
            cpio jq patchelf xxd ccache clang lld \
            libarchive-tools libbrotli-dev libgtest-dev libprotobuf-dev \
            libunwind-dev libpcre2-dev libzstd-dev protobuf-compiler

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build kernel (${{ matrix.target }})
        run: |
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.target }}
          path: build/out/${{ matrix.target }}/*.zip
          
